name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Closure-sweep item 5(b) [build-time incident, ledgered]: close-together
# pushes to the same ref were observed racing each other's cache save
# ("Unable to reserve cache...") -- the loser rebuilds cold instead of
# hitting the winner's just-saved cache. Serializing runs per ref removes
# the race outright (only one run per group executes at a time).
# `cancel-in-progress: true` is deliberately chosen over queuing: an
# outdated commit's CI run has no value once a newer push to the SAME ref
# exists (its result will never be acted on -- the newer commit is what
# actually lands), so cancelling it immediately frees the runner instead
# of finishing a run nobody needs. `github.ref` (not github.sha) is the
# group key on purpose -- it is what makes pushes to the SAME branch/PR
# serialize while a DIFFERENT branch/PR's runs stay fully independent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned zig 0.16.0 toolchain download, shared by both jobs below. The
# sha256 is the real published checksum for zig-x86_64-linux-0.16.0.tar.xz,
# taken directly from https://ziglang.org/download/index.json (the
# "0.16.0" -> "x86_64-linux" -> "shasum" field) -- never invented. It was
# additionally cross-checked by downloading the tarball, verifying this
# checksum against it, extracting it, and confirming the extracted `zig`
# binary's own sha256 is byte-for-byte identical to this repository's
# already-in-use toolchain/zig/zig (gitignored; fetched once by a
# developer) on the machine this workflow was authored on.
env:
  RX_ZIG_VERSION: "0.16.0"
  RX_ZIG_ARCHIVE: "zig-x86_64-linux-0.16.0.tar.xz"
  RX_ZIG_URL: "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
  RX_ZIG_SHA256: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

jobs:
  linux-native:
    name: linux-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mesa-vulkan-drivers provides lavapipe (llvmpipe's Vulkan ICD, lvp_icd.json)
      # -- the only Vulkan device this runner has, since it has no real GPU.
      # vulkan-tools gives vulkaninfo for diagnostics if a run ever needs it.
      # libvulkan-dev provides the Vulkan loader (libvulkan.so.1) that volk
      # dlopens at runtime. xvfb provides the X server SDL3 needs even though
      # every window this codebase creates is hidden (visible=false) --
      # SDL3 still requires *some* video driver backend to initialize.
      #
      # libx11-dev/libxext-dev/libxrandr-dev/libxcursor-dev/libxi-dev/
      # libxfixes-dev/libxss-dev/libxtst-dev/libxkbcommon-dev: discovered
      # missing across the first two real runs of this workflow -- SDL3's
      # own build (third_party/CMakeLists.txt, built from source through
      # the dep-cache) hard-fails its CMake configure without X11
      # development libraries present at all ("SDL could not find X11 or
      # Wayland development libraries"), which this codebase's own
      # development machine never surfaced (it already had a full desktop
      # environment's dev packages installed). The first run only
      # surfaced the top-level "no X11 at all" failure; fixing that with
      # just libx11-dev+libxext-dev revealed a second, more specific fatal
      # check ("Couldn't find dependency package for XTEST") one level
      # deeper in the same CheckX11 macro, since CMake configure stops at
      # the first fatal error and never reaches later checks. Cross-checked
      # directly against SDL3's own cmake/sdlchecks.cmake CheckX11 macro
      # (release-3.4.14) for every *other* SDL_missing_dependency() call it
      # can still reach (XCURSOR/XINPUT/XFIXES/XRANDR/XSCRNSAVER/XTEST all
      # require a real library; XDBE/XSHAPE/XSYNC only need headers already
      # covered by libx11-dev/libxext-dev) so this is the complete set, not
      # another one-check-at-a-time guess.
      #
      # vulkan-validationlayers [post-release fix, CI run acfce89]: provides
      # VK_LAYER_KHRONOS_validation itself -- a SEPARATE Ubuntu package from
      # libvulkan-dev/vulkan-tools/mesa-vulkan-drivers above, none of which
      # pull it in as a dependency (verified directly: apt-cache depends on
      # each of those three lists no vulkan-validationlayers pull-in, and
      # this package was simply never in this list). Its absence was root-
      # caused, not assumed: rx_rhi_vk/src/context.cpp's own
      # VK_EXT_validation_features probe already queries vk-bootstrap's
      # SystemInfo, whose available_extensions it verified (by reading the
      # pinned vk-bootstrap commit 556b79b's SystemInfo constructor
      # directly) already merges each installed layer's OWN extensions via
      # a per-layer vkEnumerateInstanceExtensionProperties(layer.layerName,
      # ...) call -- i.e. that probe is already layer-scoped, not the
      # unscoped bug it might look like at a glance. Reproduced the CI log's
      # exact "VK_EXT_validation_features unavailable... will not be
      # active" warning locally by pointing VK_LAYER_PATH at an empty
      # directory (simulating the layer being genuinely undiscoverable,
      # exactly this runner's real state before this line existed) against
      # an otherwise-unmodified rx_rhi_vk_tests binary, and confirmed the
      # warning disappears with the layer package installed and VK_LAYER_PATH
      # unset -- i.e. this one missing apt package, not any code path in
      # this repository, was the entire root cause. See descriptor_arena.h/
      # .cpp's own "BUDGETS ARE ARENA-ENFORCED" comment for this same CI
      # run's other, unrelated finding (DescriptorArena's exhaustion
      # contract relying on driver-optional VkDescriptorPool enforcement).
      - name: Install system packages
        # timeout-minutes + Acquire::Retries: runner apt mirrors stall
        # indefinitely on bad days (3 observed 2026-08-19, 20-47 min
        # hangs) — fail fast so a rerun costs minutes, not an hour.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            ninja-build mesa-vulkan-drivers vulkan-tools libvulkan-dev \
            vulkan-validationlayers xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev

      - name: Install pinned zig toolchain (checksum-verified)
        run: |
          curl -fsSL -o "/tmp/${RX_ZIG_ARCHIVE}" "${RX_ZIG_URL}"
          echo "${RX_ZIG_SHA256}  /tmp/${RX_ZIG_ARCHIVE}" | sha256sum -c -
          mkdir -p toolchain/zig
          tar -xf "/tmp/${RX_ZIG_ARCHIVE}" -C toolchain/zig --strip-components=1
          toolchain/zig/zig version

      # Keyed per-job (not shared with windows-cross-zig, unlike before):
      # tools/fetch_slang.cmake fetches ONE platform subtree here
      # (third_party/slang-prebuilt/linux-x86_64/, host==target on this
      # preset) but windows-cross-zig fetches TWO (that same linux-x86_64/
      # host tree for slangc, PLUS a second windows-x86_64/ tree for the
      # target-side runtime libs) under the identical path. A shared key
      # across both jobs was fine before this task (both jobs populated the
      # same single subtree), but is now a real cache-effectiveness bug
      # (tracked from Task 1's review): actions/cache never re-saves an
      # exact key match, so whichever job's save "wins" that shared key
      # forever after starves the other job of a hit for the subtree only
      # IT populates -- windows-cross-zig would end up re-fetching its
      # windows-x86_64/ tree from GitHub on every single cold-restore run
      # (self-healing, not a correctness bug, just a silently-defeated
      # cache). Per-job keys mean each job's full fetched state (both
      # subtrees for windows-cross-zig, one for linux-native) is exactly
      # what gets saved and restored for that job every time.
      - name: Cache prebuilt Slang
        uses: actions/cache@v5
        with:
          path: third_party/slang-prebuilt
          key: slang-prebuilt-linux-native-${{ hashFiles('tools/fetch_slang.cmake') }}

      # Phase 4 Stage 1 Task 13 [spec D16]: DamagedHelmet is the
      # mandatory glTF import gate asset (rx_asset_gltf_gpu_tests'
      # damaged_helmet_test.cpp) -- cached exactly like Slang above
      # (tools/fetch_assets.sh's own versioned marker file makes a
      # version bump self-invalidating). Sponza is now fetched too (see
      # the fetch step's own comment) for the temporary packaging bundle;
      # D16 still exempts it from any ctest gate.
      # Closure-sweep item 5(a) [build-time incident, ledgered]: this key
      # rotates on any tools/fetch_assets.sh edit (e.g. a version-marker
      # bump), and without a restore-keys fallback that rotation forced a
      # 100% cold re-fetch instead of a warm partial -- costly for
      # DamagedHelmet specifically only in wall-clock/API-rate terms (the
      # actual fetch is small), but the SAME pattern below matters far
      # more for .deps-cache (see that step's own comment). Safe to fall
      # back to a stale same-prefix cache here: fetch_assets.sh's own
      # per-asset VERSION-named marker file (DAMAGED_HELMET_MARKER, this
      # script's own header comment) makes a stale restore self-
      # correcting -- either the marker matches the current pinned
      # version (fast no-op, correct) or it doesn't (the version-specific
      # filename simply isn't found, so the script re-fetches and re-
      # verifies checksums from scratch) -- never a silent stale-asset
      # reuse.
      - name: Cache fetched test assets (DamagedHelmet + Sponza)
        uses: actions/cache@v5
        with:
          path: assets/fetched
          key: fetched-assets-all-${{ hashFiles('tools/fetch_assets.sh') }}
          restore-keys: |
            fetched-assets-all-
            fetched-assets-damagedhelmet-

      # --sponza added 2026-08-20: package_samples.sh now bundles Sponza
      # into the 09_scene package (TEMPORARY pre-go-live bundling, owner
      # directive) and fails loudly without it, so CI's packaging step
      # needs the asset fetched. The cache key was renamed (damagedhelmet-
      # -> all-) so an existing helmet-only cache entry doesn't exact-match
      # and block the first sponza-inclusive save; the old prefix stays in
      # restore-keys as a warm partial. fetch_assets.sh's version-marker
      # self-correction covers staleness either way.
      - name: Fetch test assets (DamagedHelmet + Sponza)
        run: tools/fetch_assets.sh --sponza

      # Unlike the Slang cache above, this key is job-specific
      # (deps-cache-linux-native-..., not shared with windows-cross-zig):
      # DepCache.cmake's own cache key already includes the target triple
      # and zig version, so this preset's .deps-cache/ subdirectories never
      # collide with the other job's -- but actions/cache treats an exact
      # key match across concurrent jobs as a single cache *entry*, and
      # only the first job to finish successfully saves it. Two jobs
      # racing on one shared key would starve whichever job loses the
      # race of ever getting its own dependencies cached. A per-preset key
      # keeps each job's cache independent.
      #
      # Closure-sweep item 5(a) [build-time incident, ledgered]: this key
      # rotates on ANY third_party/CMakeLists.txt edit (adding/pinning a
      # dependency, tweaking one's CMAKE_ARGS, etc.) -- common -- and
      # without a restore-keys fallback, that rotation forced a ~20-minute
      # 100% cold rebuild of EVERY dependency instead of a warm partial
      # rebuild of only the changed one(s). Safe to fall back to a stale
      # same-prefix cache: DepCache.cmake's own rx_add_cached_dependency()
      # (cmake/DepCache.cmake) keys EACH dependency's own subdirectory
      # independently on that dependency's full content/config hash
      # (name-<hash>, this file's own header comment) and only ever
      # CONSULTS the exact subdirectory matching the CURRENT hash -- a
      # restored stale cache's unrelated/outdated subdirectories are
      # simply never looked up (no ".rx-built" marker under the NEW hash
      # means a clean [dep-cache] MISS and a real rebuild for exactly that
      # dependency, same as a cold cache) and cost nothing but harmless
      # extra disk space; every dependency whose hash DIDN'T change still
      # hits its own already-built subdirectory. I.e. this mechanism
      # cannot serve a stale/incorrect build for a changed dependency --
      # it can only ever skip rebuilding dependencies that provably did
      # NOT change.
      - name: Cache third-party dependency builds
        uses: actions/cache@v5
        with:
          path: .deps-cache
          key: deps-cache-linux-native-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/DepCache.cmake', 'cmake/toolchains/linux-native.cmake', 'cmake/zig-wrappers/*') }}
          restore-keys: |
            deps-cache-linux-native-

      - name: Configure
        run: cmake --preset linux-native

      # Closure-sweep item 5 minor [no-deferral: closed, not merely
      # documented]: the restore-keys fallback above (added for the SAME
      # reason as the .deps-cache step's own comment) means a restored
      # cache can carry forward hash-keyed subdirectories from an OLDER
      # configure that this run no longer references at all (a removed
      # dependency, a re-pinned tag, a changed CMAKE_ARGS/toolchain
      # hash) -- nothing else ever deletes them, so the saved cache would
      # otherwise grow monotonically across many third_party edits,
      # eventually approaching GitHub's 10GB total cache limit. The
      # Configure step just above (cmake/DepCache.cmake's own
      # rx_add_cached_dependency(), see that file's own header comment)
      # writes the exact, authoritative set of cache-dir keys THIS
      # configure actually needs to build/linux-native/deps-cache-
      # manifest.txt -- and since a FATAL_ERROR during that step would
      # already have aborted the job before reaching here, every key in
      # that manifest names a dependency that is genuinely built and
      # installed. Anything under .deps-cache/ NOT in that manifest is
      # therefore provably stale -- delete it now, before the cache-save
      # (an implicit post-job step of the "Cache third-party dependency
      # builds" step above) uploads whatever is left.
      - name: Prune stale dependency cache entries
        run: |
          manifest="build/linux-native/deps-cache-manifest.txt"
          # `-s` (exists AND non-empty), not `-f` (exists only): an EMPTY
          # manifest is not a real failure mode under the current call
          # graph (rx_add_cached_dependency() always appends at least one
          # key before Configure can succeed), but relying on that stays
          # implicit -- an empty file would make every `grep -qxF` below
          # miss, so the loop would delete every subdirectory instead of
          # nothing. `-s` fails this step outright (bash runs with
          # -eo pipefail here, so a bare failing `test` aborts the step,
          # same fail-hard behavior the missing-file case already had)
          # before the loop is ever reached, for both missing AND empty --
          # verified directly for all three cases (missing/empty/
          # populated) under `bash --noprofile --norc -eo pipefail`.
          test -s "${manifest}"
          for dir in .deps-cache/*/; do
            key="$(basename "${dir}")"
            if ! grep -qxF "${key}" "${manifest}"; then
              echo "[prune] removing stale dependency cache entry: ${key}"
              rm -rf "${dir}"
            fi
          done

      - name: Build
        run: cmake --build --preset linux-native

      # lavapipe provides the Vulkan device; Xvfb provides the display SDL3
      # needs to initialize a (hidden) window. This is not a soft/best-effort
      # run: verified locally (forcing VK_ICD_FILENAMES to lavapipe only, and
      # running the whole suite under xvfb-run) that all 17 tests -- including
      # rx_rhi_vk_tests, rx_shader_tests, rx_graph_tests/rx_graph_gpu_tests,
      # rx_material_tests/rx_material_gpu_tests, and all seven
      # sample_*_headless gates (01_triangle, 02_hotreload, 03_bindless_mesh,
      # 04_streaming, 05_multipass, 06_materials, 07_stress [Phase 4 Task 7,
      # counters only per D18 -- see this file's own dedicated wall-clock
      # step below]) -- genuinely execute their real assertions against
      # lavapipe rather than hitting a skip guard -- lavapipe is a real, if
      # software, Vulkan 1.3+ implementation.
      # The sample gates fail closed
      # (a crash or a wrong-pixel assertion is a real ctest FAILED, not a
      # silent skip), so ctest's own per-test "... Passed" line for each of
      # them, printed unconditionally below regardless of
      # --output-on-failure, IS the proof they ran -- kept visible in the
      # raw log rather than only inside the junit file.
      #
      # --output-junit also writes a self-verifying, structured report (one
      # <testcase> per test, each with the full captured stdout/stderr as
      # <system-out> -- e.g. every sample's own "... headless gate PASSED"
      # log line lands inside it) uploaded as its own artifact below,
      # closing Phase 1's deferred-minor suggestion to consider
      # -V/--output-junit for exactly this reason: a durable, greppable
      # artifact that outlives the raw console log.
      #
      # When upgrading vulkan-validationlayers to a newer version: verify
      # the four context.cpp false-positive guards remain valid against the
      # new layer's reported message set:
      # 1. isKnownPortabilityEnumerationLayerBug() (line 33)
      # 2. isKnownUnrecognizedSlangSourceLanguageBug() (line 65)
      # 3. isKnownSyncValidationSeparateSamplerMisclassification() (line 122)
      # 4. isKnownSyncValidationSeparateSamplerMisclassificationViaExecuteCommands()
      #    [Phase 4 Task 7] -- the same #3 root cause, reported one level up
      #    (vkCmdExecuteCommands, not vkCmdDraw) for a chunked pass's
      #    secondary command buffer.
      # If any guard-suppressed message is no longer generated, remove that guard.
      # If new false-positive messages appear, add guards for them (the
      # existing four are KNOWN false-positives reproduced locally, which is
      # the only acceptable reason to suppress validation messages).
      - name: Test (xvfb + lavapipe)
        run: >-
          echo "Installed validation layers version:"
          && dpkg -l | grep vulkan-validationlayers
          && xvfb-run -a ctest --preset linux-native --output-on-failure
          --output-junit ${{ github.workspace }}/ctest-results-linux-native.xml

      # Phase 4 Task 7 [spec D18]: the ctest-registered sample_07_stress_headless
      # gate (already run above, part of the Test step, --draws 16) asserts
      # COUNTERS only (draws submitted, chunk count, pool allocations) --
      # deterministic, never flaky on a shared runner. Wall-clock is a
      # SEPARATE, explicitly non-gating concern (G15: >30% shared-runner
      # variance) -- this step runs the same binary at the real 30000-draw
      # default, headless (no window/Xvfb-juggling-a-background-process
      # complexity needed: headless mode's own per-frame "stress: ..."
      # stdout line already carries cpu_record_ms, the exact metric this
      # task's report cites -- samples/07_stress/main.cpp's runHeadless()),
      # once with --threads 1 (the single-thread A/B baseline) and once at
      # the Scheduler's own default worker count, and publishes both runs'
      # raw stdout as one artifact -- trend-tracked, never CI-blocking.
      - name: Stress sample wall-clock numbers (published, non-blocking)
        run: >-
          { echo "=== sample_07_stress --draws 30000 --threads 1 (single-thread baseline) ===";
            xvfb-run -a build/linux-native/samples/07_stress/sample_07_stress --draws 30000 --threads 1;
            echo;
            echo "=== sample_07_stress --draws 30000 (default worker count) ===";
            xvfb-run -a build/linux-native/samples/07_stress/sample_07_stress --draws 30000; } | tee stress-numbers.txt

      - name: Upload stress numbers artifact
        uses: actions/upload-artifact@v7
        with:
          name: stress-numbers
          path: stress-numbers.txt
          if-no-files-found: error

      # Phase 4 Stage 2 Task 24 [gate ruling #15, matrix row 23]:
      # sample_09_scene's own `--stress` mode through the FULL scene path --
      # same two-tier treatment as sample 07 above (the ctest-registered
      # sample_09_scene_stress_headless gate, already run as part of the
      # Test step, asserts COUNTERS only at a small --stress-draws value;
      # this is the SEPARATE, non-blocking wall-clock step at the real
      # 30000-instance default). Published as its OWN stress-v2-numbers.txt
      # artifact, alongside (never replacing) sample 07's own
      # stress-numbers.txt -- the A/B comparability contract's own "sample
      # 07's report format stays untouched" instruction.
      - name: Stress-v2 sample wall-clock numbers (published, non-blocking)
        run: >-
          { echo "=== sample_09_scene --stress --stress-draws 30000 --threads 1 (single-thread baseline) ===";
            xvfb-run -a build/linux-native/samples/09_scene/sample_09_scene --stress --stress-draws 30000 --threads 1;
            echo;
            echo "=== sample_09_scene --stress --stress-draws 30000 (default worker count) ===";
            xvfb-run -a build/linux-native/samples/09_scene/sample_09_scene --stress --stress-draws 30000; } | tee stress-v2-numbers.txt

      - name: Upload stress-v2 numbers artifact
        uses: actions/upload-artifact@v7
        with:
          name: stress-v2-numbers
          path: stress-v2-numbers.txt
          if-no-files-found: error

      # Real incremental-rebuild timing, not a no-op: tools/check_build_budget.sh
      # touches src/rx_core/src/log.cpp itself before timing.
      - name: Build budget check
        run: tools/check_build_budget.sh linux-native 60

      # Packages all nine samples into the exact unzip-and-run layout a user
      # gets [R:D2]: one subdirectory per sample with that sample's binary
      # plus everything IT needs (01_triangle: just its two precompiled
      # .spv files, no Slang libs; 02/03/04/05/06/07/08/09: the Slang
      # runtime libs + LICENSE deployed next to each at build time, plus
      # 02's hotreload.slang / 03's texture.png / 05's six on-disk shader
      # sources / 06's materials/+material_shaders/ subdirectories / 07's
      # four on-disk shader sources / 08's material_shaders/+references/
      # subdirectories plus a pre-staged DamagedHelmet asset + its own
      # dual-license attribution text / 09's material_shaders/+
      # shadow_shaders/+references/ subdirectories plus the same pre-staged
      # DamagedHelmet asset). See tools/package_samples.sh for the full
      # per-sample manifest and why each file is there.
      - name: Package samples for redistribution
        run: tools/package_samples.sh linux-native linux-x86_64 rendererx-samples-linux-x86_64.zip

      - name: Upload sample artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: rendererx-samples-linux-x86_64
          path: rendererx-samples-linux-x86_64.zip
          if-no-files-found: error

      - name: Upload ctest junit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctest-results-linux-native
          path: ctest-results-linux-native.xml
          if-no-files-found: error

  windows-cross-zig:
    name: windows-cross-zig
    runs-on: ubuntu-latest
    # This project's cross-compiled binaries are x86_64-windows-gnu only --
    # pure 64-bit, no 32-bit WoW64 component ever needed -- so pin
    # WINEARCH=win64 rather than let a brand-new prefix default to win32
    # (which pulls in a wine32/i386-multiarch dependency this project never
    # otherwise needs). Note this alone did NOT fix the Vulkan-surface
    # failure below (verified: the same failure reproduced identically with
    # WINEARCH pinned) -- it's kept as separately-correct hygiene for a
    # 64-bit-only target, not as that fix.
    env:
      WINEARCH: win64
    steps:
      - uses: actions/checkout@v7

      # wine runs the cross-compiled Windows test binaries transparently
      # (cmake/toolchains/windows-cross-zig.cmake sets it as
      # CMAKE_CROSSCOMPILING_EMULATOR when found). xvfb: same reason as the
      # linux-native job -- SDL3 needs a video driver backend even for
      # hidden windows, and Wine's own window creation additionally wants a
      # real X server underneath it.
      #
      # mesa-vulkan-drivers/vulkan-tools/libvulkan-dev: discovered missing
      # on this workflow's first real run of this job. rx_platform's
      # Window::create() (src/rx_platform/src/window.cpp) unconditionally
      # requests SDL_WINDOW_VULKAN -- even rx_platform_tests' "any video
      # driver" lifecycle case, which has no skip guard -- and Wine's own
      # built-in Vulkan support (winevulkan/vulkan-1.dll) is a passthrough
      # to whatever real Vulkan loader/ICD exists on the *host*: with none
      # installed on this runner, winevulkan has nothing to pass through to
      # and reports zero surface support, so SDL_CreateWindow(...,
      # SDL_WINDOW_VULKAN) failed outright (not a skip -- a real failure) in
      # this job's very first ctest run. Installing the same lavapipe +
      # loader packages the linux-native job uses gives winevulkan a real
      # (software) Vulkan implementation to forward to, without changing
      # what's excluded below: rx_rhi_vk_tests and every sample_*_headless
      # gate stay excluded from ctest -- exercising this project's actual
      # device/swapchain/synchronization2 pipeline through Wine's Vulkan
      # passthrough is a materially bigger claim than "window creation
      # succeeds" and is not verified here.
      - name: Install system packages
        # Same stall guard as the linux-native job (see comment there).
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y \
            ninja-build wine xvfb mesa-vulkan-drivers vulkan-tools libvulkan-dev

      - name: Install pinned zig toolchain (checksum-verified)
        run: |
          curl -fsSL -o "/tmp/${RX_ZIG_ARCHIVE}" "${RX_ZIG_URL}"
          echo "${RX_ZIG_SHA256}  /tmp/${RX_ZIG_ARCHIVE}" | sha256sum -c -
          mkdir -p toolchain/zig
          tar -xf "/tmp/${RX_ZIG_ARCHIVE}" -C toolchain/zig --strip-components=1
          toolchain/zig/zig version

      # Per-job key -- see the linux-native job's identically-worded comment
      # above the equivalent step for why (this job is the one that
      # actually populates two platform subtrees under this one cache path,
      # which is what made a shared key a cache-effectiveness bug in the
      # first place).
      - name: Cache prebuilt Slang
        uses: actions/cache@v5
        with:
          path: third_party/slang-prebuilt
          key: slang-prebuilt-windows-cross-zig-${{ hashFiles('tools/fetch_slang.cmake') }}

      # Phase 4 Stage 1 Task 13: rx_asset_gltf_gpu_tests (including
      # damaged_helmet_test.cpp) is not in this job's GPU-test exclusion
      # list below (same posture as the pre-existing rx_asset_tests) --
      # see the linux-native job's identically-worded step for the full
      # rationale.
      # Closure-sweep item 5(a) -- same restore-keys fallback and the same
      # rationale as the linux-native job's identically-worded step above
      # (a stale same-prefix restore is safe here: fetch_assets.sh's own
      # version-named marker file self-corrects).
      - name: Cache fetched test assets (DamagedHelmet + Sponza)
        uses: actions/cache@v5
        with:
          path: assets/fetched
          key: fetched-assets-all-${{ hashFiles('tools/fetch_assets.sh') }}
          restore-keys: |
            fetched-assets-all-
            fetched-assets-damagedhelmet-

      # --sponza added 2026-08-20: package_samples.sh now bundles Sponza
      # into the 09_scene package (TEMPORARY pre-go-live bundling, owner
      # directive) and fails loudly without it, so CI's packaging step
      # needs the asset fetched. The cache key was renamed (damagedhelmet-
      # -> all-) so an existing helmet-only cache entry doesn't exact-match
      # and block the first sponza-inclusive save; the old prefix stays in
      # restore-keys as a warm partial. fetch_assets.sh's version-marker
      # self-correction covers staleness either way.
      - name: Fetch test assets (DamagedHelmet + Sponza)
        run: tools/fetch_assets.sh --sponza

      # Closure-sweep item 5(a) -- same restore-keys fallback and the same
      # rationale as the linux-native job's identically-worded step above
      # (DepCache.cmake's own per-dependency content hashing makes a
      # stale same-prefix restore safe: it can only skip rebuilding
      # dependencies that provably did not change, never serve a stale
      # one).
      - name: Cache third-party dependency builds
        uses: actions/cache@v5
        with:
          path: .deps-cache
          key: deps-cache-windows-cross-zig-${{ hashFiles('third_party/CMakeLists.txt', 'cmake/DepCache.cmake', 'cmake/toolchains/windows-cross-zig.cmake', 'cmake/zig-wrappers/*') }}
          restore-keys: |
            deps-cache-windows-cross-zig-

      - name: Configure
        run: cmake --preset windows-cross-zig

      # Closure-sweep item 5 minor -- same prune step and the same
      # rationale as the linux-native job's identically-worded step above
      # (cmake/DepCache.cmake's own manifest write, this job's own build
      # dir).
      - name: Prune stale dependency cache entries
        run: |
          manifest="build/windows-cross-zig/deps-cache-manifest.txt"
          # `-s` (exists AND non-empty), not `-f` -- see the linux-native
          # job's identically-worded step above for the full rationale
          # (an empty manifest must fail this step outright, not silently
          # let the loop below delete every subdirectory).
          test -s "${manifest}"
          for dir in .deps-cache/*/; do
            key="$(basename "${dir}")"
            if ! grep -qxF "${key}" "${manifest}"; then
              echo "[prune] removing stale dependency cache entry: ${key}"
              rm -rf "${dir}"
            fi
          done

      - name: Build
        run: cmake --build --preset windows-cross-zig

      # The windows-cross-zig preset builds with RX_TRACY=OFF (Tracy's profiler
      # thread hangs at process exit under CI cold-prefix Wine; profiling has no
      # value through Wine anyway -- see CMakeLists.txt's RX_TRACY note). This
      # throwaway configure+build with RX_TRACY=ON still verifies the Windows
      # cross-compile of TracyClient.cpp stays healthy, WITHOUT running any
      # Tracy-linked binary under Wine.
      - name: Verify RX_TRACY=ON cross-compiles for Windows (build only, no run)
        run: |
          cmake -S . -B build/windows-tracy-buildcheck \
            --toolchain cmake/toolchains/windows-cross-zig.cmake \
            -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRX_TRACY=ON -DRX_DEBUG_CHECKS=ON
          cmake --build build/windows-tracy-buildcheck

      - name: Wine toolchain smoke check
        run: wine build/windows-cross-zig/tools/toolchain_check/toolchain_check.exe

      # rx_rhi_vk (GPU-backed), rx_graph_gpu_tests (Task 3's Executor GPU
      # tests -- same GPU-backed reason as rx_rhi_vk_tests, added when that
      # target was introduced), rx_material_gpu_tests (Task 5's
      # MaterialSystem tests -- every one of them builds a real
      # VkGraphicsPipeline, same GPU-backed reason), rx_debug_ui_gpu_tests
      # [Phase 4 Stage 2 Task 21 -- Overlay::create() builds a real
      # VkGraphicsPipeline/descriptor pool/font-atlas texture through the
      # vendored ImGui Vulkan backend, same GPU-backed reason], and every
      # sample_*_headless gate are excluded: Wine in CI has no real Vulkan
      # device to hand them, and that is a real, documented environment
      # limitation -- not a silent pass. rx_core, rx_platform,
      # shader_spirv_test, AND rx_shader_tests all run for real under Wine
      # and are NOT excluded here -- rx_shader_tests does real in-process
      # Slang compilation (slang::createGlobalSession etc.) via the
      # MSVC-built slang-compiler.dll cross-linked through zig/LLD
      # [R:A6/D2], which needs no GPU at all (SPIR-V codegen is pure CPU
      # work), and this was investigated rather than assumed: Task 1
      # verified directly that Slang's Windows DLLs (slang-compiler.dll +
      # its slang-glslang/slang-glsl-module/slang-rt plugins) load correctly
      # under Wine and the full compiler test suite passes there -- this CI
      # run is what proves that holds on the actual GitHub Actions runner,
      # not just the development machine that first checked it.
      # rx_platform's window tests hit their own existing skip guards
      # gracefully when Wine's video backend can't produce Vulkan surface
      # extensions, exactly as they do on any other display-less machine --
      # this now also covers window_test.cpp's new preDispatch coverage
      # [Task 21], which needs no GPU at all and is device-free by design.
      - name: Test under wine (xvfb; GPU tests excluded -- no Vulkan under Wine)
        run: >-
          xvfb-run -a ctest --preset windows-cross-zig -E 'rx_rhi_vk|rx_graph_gpu|rx_material_gpu|rx_debug_ui_gpu|sample' --output-on-failure
          --output-junit ${{ github.workspace }}/ctest-results-windows-cross-zig.xml

      - name: Build budget check
        run: tools/check_build_budget.sh windows-cross-zig 60

      # Same packaging mechanism as the linux-native job -- see
      # tools/package_samples.sh and that job's identically-worded comment
      # above its own packaging step for the full per-sample manifest.
      - name: Package samples for redistribution
        run: tools/package_samples.sh windows-cross-zig windows-x86_64 rendererx-samples-windows-x86_64.zip

      - name: Upload sample artifact bundle
        uses: actions/upload-artifact@v7
        with:
          name: rendererx-samples-windows-x86_64
          path: rendererx-samples-windows-x86_64.zip
          if-no-files-found: error

      - name: Upload ctest junit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ctest-results-windows-cross-zig
          path: ctest-results-windows-cross-zig.xml
          if-no-files-found: error
